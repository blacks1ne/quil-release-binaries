name: release-binaries

# Every 15 minutes: find the newest commit on upstream's default branch
# that changes its version (`subpatch` or VERSION_STRING; .github/
# version.sh); if this repo has no release for that version yet, build
# node and qclient at that commit with the project's node/build.sh and
# publish them as the latest release. notes/<version>.md,
# when present, is appended to that version's release (at publication, or
# by the notes job once it lands). A dispatch with dry_run builds and
# uploads the binaries as run artifacts and publishes nothing.
#
# Each run also reads the official listing (.github/public.sh) and keeps
# its per-file digests in public.txt. When they change without a new
# version (the official binaries were rebuilt in place), the run builds
# the default branch's tip if that is at the listed version (plus any
# subpatch) and not released yet, as v<version>-<sha8> with the official
# digests in its notes; upstream names no commit for the official
# binaries, so this never claims to be them. A tip at another version
# builds nothing and fails the run once, as the notice.
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths: ['notes/**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload artifacts only; create or edit no release or notes
        type: boolean
        default: false
      sha:
        description: Upstream commit to build (dry runs only; default the newest version change)
        type: string
        default: ''
      save_cache:
        description: Save the dependency cache from this branch too (main always saves)
        type: boolean
        default: false

permissions:
  contents: read

# Publishing runs queue behind each other. A dry run publishes nothing,
# so it gets its own group: it never delays or replaces a pending
# publishing run.
concurrency:
  group: ${{ inputs.dry_run && format('release-binaries-dry-{0}', github.ref) || 'release-binaries' }}
  cancel-in-progress: false

env:
  UPSTREAM: QuilibriumNetwork/monorepo
  PUBLIC_BASE: https://releases.quilibrium.com
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: bash .github/test-version.sh
      - run: bash .github/test-public.sh

  # mode: release (build and publish), notes (already released: update
  # its notes), dry (build only), follow (the official listing changed:
  # build and publish the tip), record (it changed, the tip is already
  # released: record it) or notice (it changed, no commit maps: record it
  # and fail). name is the release's version: version, or version-<sha8>
  # for follow.
  detect:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.d.outputs.sha }}
      version: ${{ steps.d.outputs.version }}
      name: ${{ steps.d.outputs.name }}
      mode: ${{ steps.d.outputs.mode }}
      public: ${{ steps.d.outputs.public }}
      public_error: ${{ steps.d.outputs.public_error }}
    steps:
      - uses: actions/checkout@v5

      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          SHA_INPUT: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          dry=false; [ "$DRY_RUN" = true ] && dry=true
          if [ "$dry" = false ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::only main publishes; dispatch from $GITHUB_REF with dry_run"; exit 1
          fi
          if [ -n "$SHA_INPUT" ]; then
            [ "$dry" = true ] || { echo "::error::sha needs dry_run: a release builds only the newest bump"; exit 1; }
            [[ "$SHA_INPUT" =~ ^[0-9a-f]{7,40}$ ]] || { echo "::error::sha '$SHA_INPUT' is not a commit hash"; exit 1; }
            sha=$(gh api "repos/$UPSTREAM/commits/$SHA_INPUT" --jq .sha)
          else
            branch=$(gh api "repos/$UPSTREAM" --jq .default_branch)
            sha=$(bash .github/version.sh pick "$UPSTREAM" "$branch")
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no commit to build (got '$sha')"; exit 1; }
          v=$(bash .github/version.sh at "$UPSTREAM" "$sha")
          name=$v
          # The official listing: a failure to read it never holds a
          # version release; the public-error job fails the run.
          pmode=error
          eof=EOF_$(openssl rand -hex 16)
          if [ "$dry" = false ]; then
            if pub=$(bash .github/public.sh detect "$PUBLIC_BASE" public.txt released.txt "$UPSTREAM" "$branch" public.new 2> public.err); then
              read -r pmode pv tip tv <<< "$pub"
              echo "official listing: $pub"
              { echo "public<<$eof"; cat public.new; echo "$eof"; } >> "$GITHUB_OUTPUT"
            else
              cat public.err >&2
              { echo "public_error<<$eof"; cat public.err; echo "$eof"; } >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ "$dry" = true ]; then
            mode=dry; echo "dry run: build v$v at $sha, publish nothing"
          elif ! gh release view "v$v" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            mode=release; echo "new release v$v at $sha"
          else
            case $pmode in
              follow)
                sha=$tip; v=$tv; name=$tv-${tip:0:8}; mode=follow
                echo "official $pv binaries changed: release v$name at $sha" ;;
              record) mode=record; echo "official $pv binaries changed; tip $tip already released" ;;
              notice) mode=notice; echo "official $pv binaries changed; tip $tip is at $tv" ;;
              *) mode=notes; echo "v$v already released" ;;
            esac
          fi
          { echo "sha=$sha"; echo "version=$v"; echo "name=$name"; echo "mode=$mode"; } >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: contains(fromJSON('["release", "follow", "dry"]'), needs.detect.outputs.mode)
    name: ${{ matrix.bin }} (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        name: [linux-amd64, darwin-arm64]
        bin: [node, qclient]
        include:
          # Pinned: binaries built on a newer image need its newer glibc.
          - name: linux-amd64
            runs-on: ubuntu-24.04
            quil_platform: amd64_linux
          - name: darwin-arm64
            runs-on: macos-15
            quil_platform: arm64_macos
          - bin: node
            crate: quil-node
            bin_name: quil-node
            out_base: node/build
          - bin: qclient
            crate: quil-client
            bin_name: qclient
            out_base: crates/quil-client/build
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.detect.outputs.sha }}
          lfs: true

      - name: Pull LFS files
        run: git lfs pull

      - id: native-deps
        uses: ./.github/actions/setup-native-deps

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          # The explicit cache below owns restore/save for this job.
          cache: false

      # Dependency build scripts also run cmake (aws-lc-sys) and libclang
      # (bindgen, for librocksdb-sys); neither cargo nor the native key
      # fingerprints them, so a new version of either starts a new cache.
      - id: tools
        name: fingerprint build tools
        run: |
          set -euo pipefail
          tools="$ImageOS $(cmake --version | sed -n 1p) $(clang --version | sed -n 1p)"
          echo "$tools"
          echo "key=$(printf '%s' "$tools" | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Restores compiled dependencies only: before saving, the action
      # deletes the artifacts of every crate inside the checkout, so the
      # project's own code, and the native libraries it links, is built
      # from the checkout each time. Cargo reuses a dependency only when
      # its fingerprint (source checksum, rustc, profile, features,
      # flags, target) matches. The action adds rustc's version, the
      # CARGO*/CC*/CFLAGS*/CXX*/CMAKE*/RUST* variables and a hash of
      # Cargo.lock's external packages, the manifests without versions,
      # rust-toolchain.toml and .cargo/config.toml to the key, so a
      # subpatch bump keeps it. The shared key adds the platform, the
      # binary (each resolves its own features) and the native
      # libraries, C++ compiler and build tools that C dependencies build
      # with.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}-${{ matrix.bin }}-native-${{ steps.native-deps.outputs.cache-key }}-${{ hashFiles('.github/actions/setup-native-deps/action.yml') }}-tools-${{ steps.tools.outputs.key }}
          cache-bin: false
          # No cache-on-failure: an exact key hit is never saved again,
          # so a failed or cancelled build's partial set would stay.
          # Main saves. A branch saves only on request (to measure a
          # warm build); its entries are visible to that branch alone.
          save-if: ${{ github.ref == 'refs/heads/main' || inputs.save_cache == true }}

      - name: build release ${{ matrix.bin }} binary
        env:
          QUIL_PLATFORM: ${{ matrix.quil_platform }}
          FLINT_DIR: ${{ runner.os == 'macOS' && steps.native-deps.outputs.flint-dir || '' }}
          CRATE_NAME: ${{ matrix.crate }}
          BIN_NAME: ${{ matrix.bin_name }}
          OUT_BIN_NAME: ${{ matrix.bin }}
          OUT_BASE_DIR: ${{ matrix.out_base }}
        run: bash node/build.sh

      - name: check and name the asset
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          NAME: ${{ needs.detect.outputs.name }}
        run: |
          set -euo pipefail
          f=${{ matrix.out_base }}/${{ matrix.quil_platform }}/${{ matrix.bin }}
          file "$f"
          if [ "$RUNNER_OS" = macOS ]; then otool -L "$f"; else ldd "$f" || true; fi
          "$f" --version | tee version.txt
          grep -qF "$VERSION" version.txt || { echo "::error::$f --version does not report $VERSION"; exit 1; }
          a=${{ matrix.bin }}-$NAME-${{ matrix.name }}
          mkdir -p out && cp "$f" "out/$a"
          cd out
          if [ "$RUNNER_OS" = macOS ]; then shasum -a 256 "$a" > "$a.sha256"; else sha256sum "$a" > "$a.sha256"; fi
          cat "$a.sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.bin }}-${{ matrix.name }}
          path: out/
          retention-days: 7

  release:
    needs: [detect, build]
    if: needs.detect.outputs.mode == 'release' || needs.detect.outputs.mode == 'follow'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true

      - name: verify assets
        env:
          NAME: ${{ needs.detect.outputs.name }}
        run: |
          set -euo pipefail
          cd assets
          for b in node qclient; do for p in linux-amd64 darwin-arm64; do
            test -s "$b-$NAME-$p" && test -s "$b-$NAME-$p.sha256"
          done; done
          files=(*)
          [ "${#files[@]}" = 8 ] || { ls -l; echo "::error::expected 8 assets"; exit 1; }
          sha256sum -c -- *.sha256

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          NAME: ${{ needs.detect.outputs.name }}
          SHA: ${{ needs.detect.outputs.sha }}
          MODE: ${{ needs.detect.outputs.mode }}
          PUBLIC: ${{ needs.detect.outputs.public }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          tpl=release-body.md
          [ "$MODE" = release ] || tpl=release-body-public.md
          sed -e "s|<version>|$NAME|g" -e "s|<bump-sha>|${SHA:0:8}|g" -e "s|<run-url>|$run_url|g" "$tpl" > body.md
          if [ "$MODE" = release ]; then
            bash .github/notes-section.sh "$VERSION" >> body.md
          else
            { printf '\nThe official listing when this build started (SHA3-256):\n\n'; while IFS= read -r l; do printf '    %s\n' "$l"; done <<< "$PUBLIC"; } >> body.md
          fi
          cat body.md
          echo "v$NAME $SHA $(date -u +%FT%TZ)" >> released.txt
          files=(released.txt)
          if [ -n "$PUBLIC" ]; then printf '%s\n' "$PUBLIC" > public.txt; files+=(public.txt); fi
          # A notes commit can land on main while the builds run.
          bash .github/record.sh "record release v$NAME" "${files[@]}"
          gh release create "v$NAME" assets/* --title "Node and qclient $NAME" --notes-file body.md --latest --target "$(git rev-parse HEAD)"

  # The official listing changed and nothing is built: record it so the
  # next run sees no change; a notice also fails this run, once.
  record:
    needs: detect
    if: needs.detect.outputs.mode == 'record' || needs.detect.outputs.mode == 'notice'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: record the official listing
        env:
          MODE: ${{ needs.detect.outputs.mode }}
          PUBLIC: ${{ needs.detect.outputs.public }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PUBLIC" > public.txt
          v=$(bash .github/public.sh version public.txt)
          bash .github/record.sh "record official listing $v" public.txt
          if [ "$MODE" = notice ]; then
            echo "::error::the official $v binaries changed, but the default branch's tip is at another version: nothing built (detect's log names the tip)"
            exit 1
          fi

  # The official listing could not be read or is malformed: version
  # releases go on, but the run fails so that it is seen.
  public-error:
    needs: detect
    if: needs.detect.outputs.public_error != ''
    runs-on: ubuntu-24.04
    steps:
      - env:
          ERR: ${{ needs.detect.outputs.public_error }}
        run: |
          printf '%s\n' "$ERR"
          echo "::error::the official listing could not be read: changes to it are not followed until it can"
          exit 1

  notes:
    needs: detect
    if: needs.detect.outputs.mode == 'notes'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: add or update the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          [ -s "notes/$VERSION.md" ] || { echo "no notes/$VERSION.md"; exit 0; }
          gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json body --jq .body > old.md
          awk '/^<!-- notes -->$/ {exit} {print}' old.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > new.md
          bash .github/notes-section.sh "$VERSION" >> new.md
          # '$a\' is sed's add-a-final-newline command, not a quote escape.
          # shellcheck disable=SC1003
          if cmp -s <(sed -e '$a\' old.md) <(sed -e '$a\' new.md); then echo "notes already current"; exit 0; fi
          gh release edit "v$VERSION" -R "$GITHUB_REPOSITORY" --notes-file new.md
          echo "notes added to v$VERSION"
